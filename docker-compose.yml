services:
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: telemed-api-gateway
    env_file: .env
    ports:
      - "31008:8100"
    depends_on:
      - appointment-service
      - consultation-service
      - emr-service
      - device-integration
      - analytics-service
      - notification-service
      - billing-service
    networks: [telemed-net]

  appointment-service:
    build:
      context: .
      dockerfile: appointment-service/Dockerfile
    container_name: telemed-appointment
    env_file: .env
    ports:
      - "31004:8101"
    depends_on:
      - postgres
      - rabbitmq
    networks: [telemed-net]

  consultation-service:
    build:
      context: .
      dockerfile: consultation-service/Dockerfile
    container_name: telemed-consultation
    env_file: .env
    ports:
      - "31007:8102"
    depends_on:
      - janus
      - rabbitmq
    networks: [telemed-net]

  emr-service:
    build:
      context: .
      dockerfile: emr-service/Dockerfile
    container_name: telemed-emr
    env_file: .env
    ports:
      - "31003:8103"
    depends_on:
      - postgres
      - redis
      - mongo
      - minio
    networks: [telemed-net]

  device-integration:
    build:
      context: .
      dockerfile: device-integration/Dockerfile
    container_name: telemed-device
    env_file: .env
    ports:
      - "31005:8104"
    depends_on:
      - rabbitmq
      - redis
    networks: [telemed-net]

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    container_name: telemed-analytics
    env_file: .env
    ports:
      - "31002:8105"
    depends_on:
      - postgres
      - mongo
    networks: [telemed-net]

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: telemed-notification
    env_file: .env
    ports:
      - "31001:8106"
    depends_on:
      - rabbitmq
    networks: [telemed-net]

  billing-service:
    build:
      context: .
      dockerfile: billing-service/Dockerfile
    container_name: telemed-billing
    env_file: .env
    ports:
      - "30001:8107"
    depends_on:
      - postgres
    networks: [telemed-net]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: telemed-frontend
    env_file: .env
    ports:
      - "5174:5174"
    depends_on:
      - api-gateway
    networks: [telemed-net]

  postgres:
    image: postgres:16
    container_name: telemed-postgres
    environment:
      POSTGRES_DB: telemedhub
      POSTGRES_USER: telemed
      POSTGRES_PASSWORD: telemed
    ports:
      - "55432:5432"
    volumes:
      - telemed_postgres_data:/var/lib/postgresql/data
    networks: [telemed-net]

  mongo:
    image: mongo:7
    container_name: telemed-mongo
    ports:
      - "27028:27017"
    volumes:
      - telemed_mongo_data:/data/db
    networks: [telemed-net]

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: telemed-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - telemed_minio_data:/data
    networks: [telemed-net]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: telemed-rabbitmq
    ports:
      - "32136:5672"
      - "32137:15672"
    networks: [telemed-net]

  redis:
    image: redis:7
    container_name: telemed-redis
    ports:
      - "6380:6379"
    networks: [telemed-net]

  janus:
    image: canyan/janus-gateway:latest
    container_name: telemed-janus
    ports:
      - "31006:8188"
      - "10000-10200:10000-10200/udp"
    networks: [telemed-net]

networks:
  telemed-net:
    driver: bridge

volumes:
  telemed_postgres_data:
  telemed_mongo_data:
  telemed_minio_data:
